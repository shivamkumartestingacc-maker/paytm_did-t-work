ive segments, one per eligible payment."},{sel:".rp-sub",text:"Exactly how many payments are left."},{sel:'[data-tap="home-scan"]',text:"The next action is the usual one: pay."}]},{label:"4 of 5: one payment away",state:()=>ge([...Rn(),...Rn(),{type:"HOME"}],_t()),notes:[{sel:".segs",text:"4 of 5 filled. One more unlocks the pick."},{sel:".recent .txn",text:"Each payment says whether it counted."}]},{label:"Qualified: the call to action changes",state:()=>ge([{type:"HOME"}],$t()),notes:[{sel:".rp",text:"A gold outline marks the new state."},{sel:'[data-tap="home-pick"]',text:"The button becomes “Pick your reward”."}]}]},{n:2,short:"Eligibility up front",title:"Explain the requirement before the user commits",body:"The pay screen says whether this payment counts, and what it changes. After paying, the success screen confirms the result in the same words.",rationale:"Predictable value came up repeatedly in the conversations. Eligibility should never be discovered after the fact.",tradeoff:"Consideration: one extra line on the pay screen. It is a single chip, never a blocker.",slides:[{label:"This payment counts: 3 of 5",state:()=>ge([{type:"NAV",screen:"pay"}],_t()),notes:[{sel:".pay-amt",text:"Amount and payee first, like any pay screen."},{sel:".pay-chip",text:"Before paying: does it count, and what changes."},{sel:'[data-tap="pay-btn"]',text:"One primary action, locked while processing."}]},{label:"A ₹60 payment won’t count",state:()=>ge([{type:"SET_PRESET",id:"auto"},{type:"NAV",screen:"pay"}],_t()),notes:[{sel:".pay-amt",text:"Below the ₹100 minimum."},{sel:".pay-chip",text:"It says why, before any money moves."}]},{label:"Success confirms +1",state:()=>ge(Rn(),_t()),notes:[{sel:".ok-hero",text:"The payment confirmation stays the hero."},{sel:".prog-card",text:"Reward feedback second: +1 and what’s left."}]}]},{n:3,short:"Choose after qualifying",title:"Let the user choose after qualifying",body:"The pick appears only when the threshold is reached. Then the user
